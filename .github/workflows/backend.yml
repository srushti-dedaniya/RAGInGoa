name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "rag/**", "scripts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "rag/**", "scripts/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -r rag/requirements.txt
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt
      - name: Cache Hugging Face embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-minilm-l6-v2-${{ hashFiles('rag/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-all-minilm-l6-v2-
      - name: Download all-MiniLM-L6-v2 into the Hugging Face cache
        env:
          HF_HUB_OFFLINE: "0"
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
      - name: Syntax check
        run: |
          python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('backend').rglob('*.py') if p.name != 'email.py']"
          python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('rag').rglob('*.py')]"
      - name: Build index
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python scripts/build_index.py --language en
          python scripts/build_index.py --language hi
          python scripts/build_index.py --language mr
      - name: Verify multilingual FAISS indexes load offline
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python -c "from backend.app.config.settings import Settings; from rag.vector_db.index import load_index; s=Settings(); indexes={code: load_index(s.index_path_for(code), model_name=s.EMBEDDING_MODEL) for code in ('en-IN','hi-IN','mr-IN')}; assert all(index is not None and index.size() > 0 for index in indexes.values()); print({code: index.size() for code, index in indexes.items()})"
      - name: Run backend + integration tests
        run: python -m pytest tests/backend tests/integration -q
      - name: Run rag tests
        run: python -m pytest tests/rag -q
