version: "3.9"

# Production-ish compose: no dev mounts, immutable images.
# Requires the images to be built first:
#   docker build -f backend/Dockerfile -t ragingoa-backend .          (repo root context)
#   docker build -f frontend/Dockerfile -t ragingoa-frontend frontend

services:
  backend:
    image: ragingoa-backend
    env_file:
      - ../../backend/.env
    environment:
      STT_ROUTER: ${STT_ROUTER:-sarvam}
      LLM_ROUTER: ${LLM_ROUTER:-openai}
      REQUIRE_INDEX: ${REQUIRE_INDEX:-true}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: ragingoa-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
